[project]
name = "trading-pipeline"
version = "0.1.0"
description = "Data -> signals -> backtest -> paper trading pipeline for short-term US stock strategies"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
