<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Sift: a sieve that catches trading ideas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a67a3"/>
      <stop offset="1" stop-color="#132c47"/>
    </linearGradient>
    <clipPath id="bowl"><path d="M20 56 H108 A44 44 0 0 1 20 56 Z"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- ideas falling in -->
  <g fill="#ffffff">
    <circle cx="38" cy="16" r="3.6" fill-opacity=".30"/><circle cx="56" cy="13" r="3.6" fill-opacity=".30"/>
    <circle cx="74" cy="16" r="3.6" fill-opacity=".30"/><circle cx="92" cy="13" r="3.6" fill-opacity=".30"/>
    <circle cx="47" cy="29" r="3.9" fill-opacity=".55"/><circle cx="65" cy="27" r="3.9" fill-opacity=".55"/>
    <circle cx="83" cy="29" r="3.9" fill-opacity=".55"/>
  </g>
  <!-- the sieve -->
  <path d="M20 56 H108 A44 44 0 0 1 20 56 Z" fill="#ffffff" fill-opacity=".13"/>
  <g clip-path="url(#bowl)" stroke="#ffffff" stroke-opacity=".5" stroke-width="2">
    <path d="M32 56V100M44 56V100M56 56V100M68 56V100M80 56V100M92 56V100M104 56V100"/>
    <path d="M20 66H108M20 76H108M20 86H108"/>
  </g>
  <!-- ideas caught on the mesh -->
  <g fill="#ff9f43">
    <circle cx="38" cy="50" r="4.6"/><circle cx="52" cy="50" r="4.6"/><circle cx="66" cy="50" r="4.6"/>
    <circle cx="80" cy="50" r="4.6"/><circle cx="94" cy="50" r="4.6"/>
  </g>
  <path d="M20 56 H108 A44 44 0 0 1 20 56 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  <rect x="104" y="53" width="20" height="7" rx="3.5" fill="#ffffff"/>
</svg>
