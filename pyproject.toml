[project]
name = "sift"
version = "0.1.0"
description = "Sift: a pre-registered research pipeline for testing short-term US stock trading ideas on free data"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lxml>=5",
    "pandas>=2.2",
    "prometheus-client>=0.20",
    "pyarrow>=17",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
